<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060817">
    <meta name="description" content="Автономная арена: два шара, оружие и физика столкновений.">
    <title>Ball Battles</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./dist/main.js"></script>
</head>
<body>
    <main class="game-shell">
        <header class="brand">
            <span class="eyebrow">AUTO BATTLE / 01</span>
            <h1>Ball Battles</h1>
        </header>
        <section class="stage" aria-label="Симуляция боя">
            <canvas id="game" width="1080" height="1920" aria-label="Crimson Red против Cornflower Blue"></canvas>
            <div class="setup" id="setup">
                <div class="setup-card">
                    <span class="eyebrow">НАСТРОЙКА БОЯ</span>
                    <h2>Сколько бойцов?</h2>
                    <div class="fighter-options" role="group" aria-label="Количество бойцов">
                        <label><input type="radio" name="fighters" value="2" checked><span>2</span></label>
                        <label><input type="radio" name="fighters" value="3"><span>3</span></label>
                        <label><input type="radio" name="fighters" value="4"><span>4</span></label>
                    </div>
                    <button class="start-button" id="start" type="button">Начать бой</button>
                </div>
            </div>
            <div class="controls">
                <button id="toggle" type="button" aria-label="Поставить бой на паузу">Пауза</button>
                <button id="restart" type="button">Новый бой</button>
            </div>
        </section>
        <p class="hint">Шары сражаются сами · оружие появляется случайно</p>
    </main>
</body>
</html>
